definitions:
  auth.loginInput:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  enum.PermissionRole:
    enum:
    - owner
    - admin
    - user
    - ""
    type: string
    x-enum-varnames:
    - OwnerPermissionRole
    - AdminPermissionRole
    - UserPermissionRole
    - NoPermissionRole
  project.Row:
    properties:
      archivedAt:
        type: string
      authorName:
        type: string
      authorSurname:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      members:
        items:
          $ref: '#/definitions/shared.MemberShort'
        type: array
      projectDescription:
        type: string
      projectName:
        type: string
      projectPictureName:
        type: string
      updatedAt:
        type: string
    type: object
  shared.MemberShort:
    properties:
      id:
        type: string
      name:
        type: string
      surname:
        type: string
    type: object
  shared.NameInput:
    properties:
      name:
        type: string
    type: object
  team.Row:
    properties:
      authorId:
        type: string
      createdAt:
        type: string
      description:
        type: string
      id:
        type: integer
      members:
        items:
          $ref: '#/definitions/shared.MemberShort'
        type: array
      name:
        type: string
      pictureName:
        type: string
      updatedAt:
        type: string
    type: object
  user.CreateInput:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      permission:
        type: string
      roleId:
        type: integer
      surname:
        type: string
      username:
        type: string
    type: object
  user.DeleteMultiInput:
    properties:
      ids:
        items:
          type: string
        type: array
    type: object
  user.Row:
    properties:
      createdAt:
        type: string
      disabled:
        type: boolean
      email:
        type: string
      id:
        type: string
      name:
        type: string
      permission:
        $ref: '#/definitions/enum.PermissionRole'
      picture:
        type: string
      role:
        type: string
      surname:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    type: object
  user.UpdateInput:
    properties:
      disabled:
        type: boolean
      email:
        type: string
      name:
        type: string
      password:
        type: string
      permission:
        type: string
      profilePicture:
        type: string
      roleId:
        type: integer
      surname:
        type: string
      username:
        type: string
    type: object
