info:
  contact: {}
paths:
  /{entity_type}:
    get:
      description: Serves a picture file for a given entity type (e.g. teams, projects)
      parameters:
      - description: Entity type (e.g. teams, projects)
        in: path
        name: entity_type
        required: true
        type: string
      - description: Picture filename
        in: query
        name: filename
        required: true
        type: string
      produces:
      - image/*
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get entity picture
      tags:
      - pictures
  /api/comments/{entity}/{entity_id}:
    get:
      description: Returns all comments for a given entity (e.g. task) by its UUID
      parameters:
      - description: Entity type (e.g. task)
        in: path
        name: entity
        required: true
        type: string
      - description: Entity UUID
        in: path
        name: entity_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/comment.Row'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get comments for an entity
      tags:
      - comments
  /api/comments/{id}/delete:
    delete:
      description: Deletes a comment by UUID; only the author or an admin can delete
      parameters:
      - description: Comment UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Delete a comment
      tags:
      - comments
  /api/comments/{id}/update:
    patch:
      consumes:
      - application/json
      description: Updates the body or attachments of a comment; only the author or
        an admin can update
      parameters:
      - description: Comment UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated comment data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/comment.UpdateCommentInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Update a comment
      tags:
      - comments
  /api/comments/add:
    post:
      consumes:
      - application/json
      description: Creates a new comment on an entity; author is taken from the authenticated
        user
      parameters:
      - description: Comment data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/comment.CreateCommentInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/comment.Row'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Add a comment
      tags:
      - comments
  /api/current/user:
    get:
      consumes:
      - application/json
      description: Takes user from access token cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.Row'
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get current user
      tags:
      - current
  /api/employee/roles:
    get:
      consumes:
      - application/json
      description: Get all roles for employees
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get roles
      tags:
      - roles
  /api/employee/roles/add:
    post:
      consumes:
      - application/json
      description: Post body with role name
      parameters:
      - description: Body with role name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/shared.NameInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Add role
      tags:
      - roles
  /api/employee/roles/delete/{id}:
    delete:
      consumes:
      - application/json
      description: Delete role by id
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Delete role
      tags:
      - roles
  /api/employee/roles/update/{id}:
    patch:
      consumes:
      - application/json
      description: Update role by id and new name
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: integer
      - description: Body with new role name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/shared.NameInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Update role
      tags:
      - roles
  /api/files/{entityType}/{entityId}/{fileId}:
    delete:
      description: Deletes a file for any entity and removes its DB record
      parameters:
      - description: Entity type
        in: path
        name: entityType
        required: true
        type: string
      - description: Entity UUID
        in: path
        name: entityId
        required: true
        type: string
      - description: File UUID
        in: path
        name: fileId
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Remove entity file
      tags:
      - files
    get:
      description: Serves a file for any entity (tasks, comments, posts)
      parameters:
      - description: Entity type
        in: path
        name: entityType
        required: true
        type: string
      - description: Entity UUID
        in: path
        name: entityId
        required: true
        type: string
      - description: File UUID
        in: path
        name: fileId
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            type: string
      summary: Get entity file
      tags:
      - files
  /api/files/{entityType}/{entityId}/upload:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a file for any entity (tasks, comments, posts). Accepts
        any file type. Returns 413 if the file exceeds the size limit.
      parameters:
      - description: Entity type (tasks, comments, posts)
        in: path
        name: entityType
        required: true
        type: string
      - description: Entity UUID
        in: path
        name: entityId
