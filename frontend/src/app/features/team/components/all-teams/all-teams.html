@if (store.teams().length === 0 && !store.isLoading()) {
  <div class="empty-state">
    <p>No teams yet.</p>
  </div>
} @else {
  <div class="teams-grid">
    @for (team of store.teams(); track team.id) {
      <div
        tuiCardLarge
        tuiHeader
        class="team-card"
        [class.has-image]="!!team.pictureName"
        [style.background-image]="cardBackground(team)"
        [style.background-color]="cardColor(team)"
      >
        <h2 tuiTitle>
          {{ team.name }}
          @if (team.description) {
            <span tuiSubtitle>{{ team.description }}</span>
          }
        </h2>

        <aside tuiAccessories>
          <tui-badge size="m" [style.background]="'var(--app-fg)'">
            {{ team.members.length }}
          </tui-badge>
        </aside>
      </div>
    }
  </div>
}
