<nav class="flex items-center justify-between px-10 py-2.5">
  <div class="flex gap-8">
    <a class="cursor-pointer" routerLink="/main" routerLinkActive="font-bold" [routerLinkActiveOptions]="{exact: false}">
      {{ 'navbar.main' | translate }}
    </a>

    <a class="cursor-pointer" routerLink="/mine" routerLinkActive="font-bold">
      {{ 'navbar.mine' | translate }}
    </a>

    @if (userStore.isAtLeastAdmin()) {
      <div class="relative">
        <button
          tuiChevron
          tuiDropdownAlign="right"
          tuiLink
          type="button"
          class="dashboard-btn"
          [class.font-bold]="isAdminActive()"
          [(tuiDropdownOpen)]="adminOpen"
          [tuiDropdown]="adminDropdown"
          tuiDropdownAlign="left"
        >
          {{ 'navbar.admin' | translate }}
        </button>
        <ng-template #adminDropdown>
          <tui-data-list>
            @for (item of adminItems; track item.route) {
              <button
                tuiOption
                type="button"
                (click)="navigateTo(item.route)"
              >
                {{ item.label | translate }}
                @if (router.url.startsWith(item.route)) {
                  <tui-icon icon="@tui.check" class="ml-auto" />
                }
              </button>
            }
          </tui-data-list>
        </ng-template>
      </div>
    }
  </div>

  <div class="flex items-center gap-8">
    <button type="button" class="cursor-pointer hover:opacity-20" (click)="this.theme.toggle()">
      <tui-icon [icon]="this.theme.isDark() ? '@tui.sun' : '@tui.moon'" />
    </button>

    <a>
      <app-picture
        [name]="this.userStore.user()?.name ?? ''"
        size="s"
        [pictureName]="this.userStore.user()?.picture ?? ''"
        entityType="users"
      ></app-picture>
    </a>
  </div>
</nav>
