services:
  db:
    image: postgres:18-alpine
    container_name: codinate_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: goawwer/codinate-backend:latest
    build:
      context: ./backend
    container_name: codinate_backend
    restart: unless-stopped
    environment:
      SERV_HOST: 0.0.0.0
      SERV_PORT: 8080
      SERV_REDIRECT_URL: ${FRONTEND_URL:-http://localhost}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      UPLOADS_DIR: /app/data/
      LOG_DIR: /app/logs/
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/data
      - logs:/app/logs

  frontend:
    image: goawwer/codinate-frontend:latest
    build:
      context: ./frontend
    container_name: codinate_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  logs:
